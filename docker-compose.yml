services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurotools
      POSTGRES_USER: neurotools
      POSTGRES_PASSWORD: neurotools
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurotools -d neurotools"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neurotools
      MINIO_ROOT_PASSWORD: neurotools-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
