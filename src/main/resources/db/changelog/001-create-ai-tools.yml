databaseChangeLog:
  - changeSet:
      id: 001-create-ai-tools
      author: codex
      changes:
        - createTable:
            tableName: ai_tools
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: slug
                  type: varchar(120)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(180)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: rating
                  type: numeric(2,1)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: votes
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: full_description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: affiliate_link
                  type: varchar(1000)
                  constraints:
                    nullable: false
              - column:
                  name: pricing
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: pros
                  type: text[]
                  constraints:
                    nullable: false
              - column:
                  name: cons
                  type: text[]
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: ai_tools
            indexName: idx_ai_tools_category
            columns:
              - column:
                  name: category
        - createIndex:
            tableName: ai_tools
            indexName: idx_ai_tools_rating
            columns:
              - column:
                  name: rating
                  descending: true
