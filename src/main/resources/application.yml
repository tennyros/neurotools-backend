spring:
  application:
    name: neurotools-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neurotools}
    username: ${DB_USERNAME:neurotools}
    password: ${DB_PASSWORD:neurotools}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  s3:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:neurotools-assets}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
