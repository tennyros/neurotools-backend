spring:
  application:
    name: neurotools-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neurotools}
    username: ${DB_USERNAME:neurotools}
    password: ${DB_PASSWORD:neurotools}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml

neurotools:
  integration:
    huggingface:
      api-url: ${HUGGINGFACE_API_URL:https://huggingface.co/api}
      timeout: ${HUGGINGFACE_TIMEOUT_MS:10000}
      max-models: ${HUGGINGFACE_MAX_MODELS:20}
    civitai:
      api-url: ${CIVITAI_API_URL:https://civitai.com/api/v1}
      api-key: ${CIVITAI_API_KEY:}
      timeout: ${CIVITAI_TIMEOUT_MS:10000}
      max-models: ${CIVITAI_MAX_MODELS:20}
  sync:
    enabled: ${SYNC_ENABLED:true}
    schedule: ${SYNC_CRON:0 0 4 * * *}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  s3:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:neurotools-assets}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
