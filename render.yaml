services:
  - type: web
    name: neurotools-backend
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CIVITAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_URL
        value: https://huggingface.co/api
      - key: CIVITAI_API_URL
        value: https://civitai.com/api/v1
      - key: SYNC_ENABLED
        value: "true"
      - key: SYNC_STARTUP_ENABLED
        value: "true"
