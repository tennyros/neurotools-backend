services:
  - type: web
    name: neurotools-backend
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLICK_TOKEN_SECRET
        sync: false
      - key: CLICK_TOKEN_TTL_HOURS
        value: "24"
      - key: CLICK_RATE_LIMIT_MAX_ATTEMPTS
        value: "5"
      - key: CLICK_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: CIVITAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_URL
        value: https://huggingface.co/api
      - key: CIVITAI_API_URL
        value: https://civitai.com/api/v1
      - key: SYNC_ENABLED
        value: "true"
      - key: SYNC_STARTUP_ENABLED
        value: "true"
